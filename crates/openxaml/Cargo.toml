[package]
name = "openxaml"
description = "XAML element model, property store, layout and composition translation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
opencomp-core = { path = "../opencomp-core" }
xbf = { path = "../xbf" }

# The example draws, so it needs the renderer; the crate itself does not.
[dev-dependencies]
opencomp-core = { path = "../opencomp-core", features = ["preview", "materials"] }
