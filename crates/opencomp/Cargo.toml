[package]
name = "opencomp"
description = "ABI-compatible Microsoft.UI.Composition runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
opencomp-core = { path = "../opencomp-core", default-features = false }
windows-core = "0.100"
windows-numerics = "0.100"

# The generated bindings use these; they are Windows-target code.
[target.'cfg(windows)'.dependencies]
windows-collections = "0.100"
windows-future = "0.100"
windows-reference = "0.100"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-time = "0.100"

