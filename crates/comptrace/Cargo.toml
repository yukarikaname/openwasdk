[package]
name = "comptrace"
description = "Inspect WinRT metadata: runtime classes, interfaces and IIDs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
object = { version = "0.37", default-features = false, features = ["std", "read", "pe"] }
windows-bindgen = "0.100"
windows-metadata = "0.100"
