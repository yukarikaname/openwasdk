# Dependabot, kept deliberately quiet.
#
# The Rust side is not a normal dependency graph: the ABI comes from generated
# bindings against a pinned Windows App SDK metadata version, so a `windows-*`
# bump has to be paired with regenerating them, not merged on its own. Major
# bumps of the graphics stack change APIs we call by hand.
#
# Actions are cheap to keep current and have no such coupling.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # One PR for the family that must move together.
    groups:
      windows:
        patterns: ["windows", "windows-*"]
    ignore:
      # Every major bump is a project decision. Within an hour of enabling this
      # file, Dependabot proposed pollster 1.0 and object 0.41 -- both would need
      # code changes, and both arrived as "an update".
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
