name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The WinRT half of opencomp only compiles for Windows, so nothing above lints it.
      - name: Clippy (Windows target)
        run: |
          rustup target add x86_64-pc-windows-msvc
          # `xwinui` is a host tool with a C dependency that needs MSVC's C compiler,
          # which this runner has but the check would still be of the host build.
          cargo clippy --workspace --all-targets --exclude xwinui --target x86_64-pc-windows-msvc -- -D warnings

      - name: Line limit
        run: |
          bad=0
          for file in $(find crates -name '*.rs'); do
            case "$file" in
              # Generated from metadata; its length is not hand-written.
              */bindings.rs|*_bindings.rs) continue ;;
            esac
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "$file: $lines lines"
              bad=1
            fi
          done
          exit $bad

  # The ABI objects only exist on Windows: activation, QueryInterface, refcounting and the node
  # table all need a real target to be exercised. Everything else runs on three hosts.
  windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Test
        run: cargo test --workspace

      # A crash in a test takes the captured output with it, so the gate is rerun with
      # `--nocapture`: its last mark on stderr names the call that faulted.
      - name: Rerun the gate with output
        if: failure()
        run: cargo test -p opencomp --test gate_a -- --nocapture --test-threads=1

      # The wgpu preview and its renderer tests are behind a feature, so the run
      # above skips them.
      - name: Test the preview renderer
        run: cargo test -p opencomp-core --features preview

      - name: Build the DLL
        run: cargo build -p opencomp

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The artifact is a Windows DLL. Checking it from Linux and macOS is what catches a
          # cfg or a dependency that only compiles for the host.
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --workspace

      # The wgpu preview and its renderer tests are behind a feature, so the run
      # above skips them.
      - name: Test the preview renderer
        run: cargo test -p opencomp-core --features preview

      # `xwinui` is a host tool: it drives the cross-compiler, it is never itself
      # built for Windows, and its TLS dependency compiles C for the target, which
      # needs an MSVC C toolchain that a macOS or Linux runner does not have.
      - name: Check the Windows artifact
        run: cargo check --workspace --all-targets --exclude xwinui --target x86_64-pc-windows-msvc

      # Checking types is not linking. Build the PE once so a missing export or a linker setting
      # fails here rather than on the machine that tries to load the DLL.
      - name: Link the Windows DLL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo build -p opencomp --target x86_64-pc-windows-gnu
          # A linked PE has no COFF symbol table; the names live in the export table.
          x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/debug/opencomp.dll \
            | grep -E "DllGetActivationFactory|DllCanUnloadNow|DllGetClassObject"

      # The ABI objects are exercised on Windows, but never under the runtime a
      # Linux user would actually have. Wine's combase is that runtime: running the
      # same tests there catches an HSTRING or activation assumption that the native
      # Windows job cannot.
      - name: Test under Wine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends wine64 xvfb
          # Ubuntu's wine64 package does not put a wrapper on PATH.
          wine=$(command -v wine64 || echo /usr/lib/wine/wine64)
          echo "using $wine"
          export WINEPREFIX="$PWD/target/wine"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          # A panic under Wine without symbols is a dead end; the gnu build carries them.
          export RUST_BACKTRACE=1
          xvfb-run -a "$wine" wineboot -u > /dev/null 2>&1 || true
          # The cdylib+lib layout hides the test binary under build/.../out, so read the
          # path out of the line cargo prints instead of guessing a directory.
          test_exe=$(cargo test -p opencomp --target x86_64-pc-windows-gnu --no-run 2>&1 \
            | sed -n 's/.*Executable.*(\(.*\))/\1/p' | tail -1)
          test "$test_exe" || { echo "no test binary"; exit 1; }
          echo "running $test_exe"
          # `timeout` inside `xvfb-run`: wrapping the wrapper leaves wine alive when the
          # wrapper is killed, and the step then waits for the job timeout anyway.
          xvfb-run -a timeout -k 5 300 "$wine" "$test_exe" --test-threads=1 --nocapture || code=$?
          if [ "${code:-0}" = 124 ] || [ "${code:-0}" = 137 ]; then
            echo "the test run was killed after the timeout; see the log above"
          fi
          exit "${code:-0}"

      # The client is the shape a real application has: a window, a tree built
      # through the ABI, an island, and a bridge that presents. Ten frames are
      # enough to prove the path; a failure names the step.
      - name: Run the client under Wine
        if: runner.os == 'Linux'
        run: |
          wine=$(command -v wine64 || echo /usr/lib/wine/wine64)
          export WINEPREFIX="$PWD/target/wine"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          cargo build -p opencomp-client --target x86_64-pc-windows-gnu
          # A GUI client under a software backend can hang; a runner that waits for
          # the job timeout tells nobody anything. Ninety seconds is generous for ten
          # frames and makes a hang a red step with a log instead.
          exe=target/x86_64-pc-windows-gnu/debug/opencomp-client.exe
          set +e
          OPENCOMP_TRACE=1 timeout 90 xvfb-run -a timeout -k 5 90 "$wine" "$exe" \
            > client.log 2>&1
          status=$?
          set -e
          cat client.log
          if [ "$status" -ne 0 ]; then
            # Wine prints the faulting address; the executable carries DWARF, so the
            # name of the function is one command away instead of a guess.
            fault=$(sed -n 's/.*at address \([0-9A-Fa-f]*\).*/\1/p' client.log | head -1)
            if [ -n "$fault" ]; then
              x86_64-w64-mingw32-addr2line -f -C -e "$exe" "0x$fault" || true
            fi
            exit "$status"
          fi

      # The flat C layer XAML imports by name. A missing export is a load failure,
      # so check one conversion and one stub, not just that the crate compiled.
      - name: Link the framework UDK stand-in
        if: runner.os == 'Linux'
        run: |
          cargo build -p openudk --target x86_64-pc-windows-gnu
          x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/debug/openudk.dll \
            | grep -E "Windowing_GetWindowIdFromWindow|Windowing_GetWindowFromWindowId|Containment_GetChangeEnabled"

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: opencomp-windows-gnu
          path: target/x86_64-pc-windows-gnu/debug/opencomp.dll
          if-no-files-found: error
